name: tests

# Config transversal (docs/CLAUDE.md): vive en main, no en una rama de capa.
# Corre en main y test -- las ramas de capa (domain, application, infrastructure/*,
# interface) se validan cuando se mergean a test, no antes de eso.
on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]

# Cancela ejecuciones anteriores si se empuja un nuevo commit a la misma rama/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-analysis:
    name: Lint & Type Checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install static analysis tools
        run: pip install ruff mypy

      - name: Run Ruff (Linter & Format check)
        run: |
          ruff check .
          ruff format --check .

      - name: Run Mypy (Type Checking)
        run: mypy domain application tests

  pytest:
    name: Pytest (${{ matrix.os }})
    needs: static-analysis
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Sin cache: pip aca -- ese modo necesita requirements.txt/pyproject.toml
          # para generar la cache key, y ninguno existe todavia (ver CLAUDE.md, "Estado
          # del repositorio"); con cache: pip puesto y sin ese archivo, este paso falla
          # el job antes de llegar a pytest (confirmado 2026-08-17). Agregarlo cuando
          # exista un archivo de dependencias real.

      # Cuando se cree el packaging real, reemplazar por `pip install -e .[dev]` o
      # equivalente -- las capas de infrastructure van a necesitar playwright, pandas,
      # pikepdf, etc., que este workflow todavia no instala.
      - name: Install test runner
        run: pip install pytest

      - name: Run tests
        run: pytest tests/ -v
