name: tests

# Config transversal: vive en main.
# Politica gradual: las fronteras hexagonales y los tests que hoy pasan BLOQUEAN;
# lint y tipos son INFORMATIVOS hasta limpiar la deuda.
# Los tests corren solo en Windows: la aplicacion es de escritorio para Windows.
# El disparador 'ci/**' permite validar este workflow antes de llegar a main;
# quitarlo cuando ya no haga falta.

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  architecture:
    name: Fronteras hexagonales
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar pytest
        run: pip install pytest==8.3.2

      - name: Verificar reglas de dependencia
        run: pytest tests/architecture -q

  quality:
    name: Lint y tipos (informativo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ruff check
        continue-on-error: true
        run: ruff check app tests --output-format github

      - name: Ruff format
        continue-on-error: true
        run: ruff format --check app tests

      - name: Mypy
        continue-on-error: true
        run: mypy app --ignore-missing-imports

  pytest:
    name: Pytest (Windows)
    needs: architecture
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
      PYTEST_QT_API: pyqt6
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      # DEUDA CONOCIDA: quitar cada linea al arreglar o actualizar su test.
      #  - test_altcha_handler: espera AltchaHandler(max_intentos=...), que no existe.
      #  - test_portal2_iess (4) y test_orchestrator_iess::test_issfa_ruta_directa:
      #    desalineados con el codigo actual.
      - name: Pytest
        run: |
          pytest tests -q \
            --ignore=tests/architecture \
            --ignore=tests/test_altcha_handler.py \
            --deselect=tests/test_orchestrator_iess.py::TestRutasPortal3::test_issfa_ruta_directa \
            --deselect=tests/test_portal2_iess.py::TestSinTabla::test_menor_sin_tabla_lanza_excepcion \
            --deselect=tests/test_portal2_iess.py::TestExtraerCedulaGridcell::test_extrae_cedula_valida \
            --deselect=tests/test_portal2_iess.py::TestExtraerAcreditador::test_flujo_completo_con_tabla \
            --deselect=tests/test_portal2_iess.py::TestExtraerAcreditador::test_flujo_sin_tabla_adulto
