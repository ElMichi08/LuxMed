<!DOCTYPE html>
<html class="h-full" lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LuxMed - Ajustes v3</title>
  <!-- Fuentes: Archivo, Archivo Narrow, IBM Plex Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#4b3f72",
            "lienzo": "#e6e6e2",
            "panel": "#fafaf8",
            "hundida": "#0ededa",
            "filete": "#c9c9c3",
            "tinta": "#1a1a18",
            "tinta-suave": "#555550",
            "tinta-atenuada": "#8e8e88",
            "error": "#a3231d",
          },
          fontFamily: {
            "sans": ["Archivo", "sans-serif"],
            "narrow": ["Archivo Narrow", "sans-serif"],
            "mono": ["IBM Plex Mono", "monospace"],
          }
        },
      },
    }
  </script>
  <style>
    /* Estilo de escritorio estricto PyQt6 / Windows: sin sombras, sin degradados, bordes nítidos de 2-3px */
    * {
      box-shadow: none !important;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
    }
    /* Scrollbars nativos planos */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #FAFAF8;
    }
    ::-webkit-scrollbar-thumb {
      background: #C9C9C3;
      border-radius: 0px;
    }
  </style>
</head>
<body class="h-full w-full m-0 p-0 overflow-hidden bg-[#E6E6E2] text-[#1A1A18] font-sans antialiased flex flex-col" style="min-width: 1280px; min-height: 800px; height: 100vh;">

  <!-- ================= 1. BARRA SUPERIOR WINDOWS (48px) ================= -->
  <header class="h-[48px] bg-[#FAFAF8] border-b border-[#C9C9C3] flex items-center justify-between px-3 shrink-0 box-border select-none">
    <!-- Brand & Estado general -->
    <div class="flex items-center gap-3">
      <!-- Monograma 'L' en caja cuadrada #1A1A18 -->
      <div class="w-6 h-6 bg-[#1A1A18] text-[#FAFAF8] flex items-center justify-center font-bold text-xs">
        L
      </div>
      <span class="font-semibold text-sm tracking-tight text-[#1A1A18]" style="font-family: 'Archivo', sans-serif;">LuxMed</span>
      <!-- Separador vertical 1px -->
      <div class="w-[1px] h-4 bg-[#C9C9C3] mx-1"></div>
      <!-- Indicador "Sin lote activo" -->
      <span class="text-xs text-[#555550] font-mono tracking-tight">Sin lote activo</span>
    </div>

    <!-- Controles derechos (Sin botón de pausa) -->
    <div class="flex items-center gap-3">
      <!-- Usuario y badge A0 -->
      <div class="flex items-center gap-2">
        <span class="text-xs font-mono text-[#555550]">admision.01</span>
        <div class="w-7 h-7 bg-[#DCDCD7] border border-[#C9C9C3] flex items-center justify-center text-[10px] font-mono font-bold text-[#1A1A18]">
          A0
        </div>
      </div>
    </div>
  </header>

  <!-- ================= CONTENEDOR PRINCIPAL: RIEL LATERAL + ÁREA DE CONTENIDO ================= -->
  <div class="flex flex-1 w-full overflow-hidden">
    
    <!-- ================= RIEL LATERAL (64px) ================= -->
    <aside class="w-[64px] bg-[#E6E6E2] border-r border-[#C9C9C3] flex flex-col justify-between shrink-0 box-border select-none">
      <div class="flex flex-col w-full">
        
        <!-- Item 1: Lote -->
        <div class="relative w-full h-[60px] flex flex-col items-center justify-center text-[#555550] hover:bg-[#DCDCD7] cursor-pointer">
          <span class="material-symbols-outlined text-[20px]">dataset</span>
          <span class="text-[10px] font-medium tracking-tight mt-1">Lote</span>
        </div>

        <!-- Item 2: Errores (Con badge rojo 4) -->
        <div class="relative w-full h-[60px] flex flex-col items-center justify-center text-[#555550] hover:bg-[#DCDCD7] cursor-pointer">
          <div class="relative flex items-center justify-center">
            <span class="material-symbols-outlined text-[20px]">warning</span>
            <span class="absolute -top-1.5 -right-2.5 bg-[#A3231D] text-white text-[9px] font-mono font-bold px-1 py-0 leading-none min-w-[14px] h-[14px] flex items-center justify-center">
              4
            </span>
          </div>
          <span class="text-[10px] font-medium tracking-tight mt-1">Errores</span>
        </div>

        <!-- Item 3: Historial (DESHABILITADO: gris claro #8E8E88, sin hover, nunca activo) -->
        <div class="w-full h-[60px] flex flex-col items-center justify-center text-[#8E8E88] cursor-not-allowed opacity-70 select-none">
          <span class="material-symbols-outlined text-[20px] text-[#8E8E88]">history</span>
          <span class="text-[10px] font-medium tracking-tight mt-1 text-[#8E8E88]">Historial</span>
        </div>

        <!-- Item 4: Ajustes (ACTIVO: fondo ligeramente claro y barra lateral índigo 3px #4B3F72) -->
        <div class="relative w-full h-[60px] flex flex-col items-center justify-center bg-[#DEDEDA] text-[#4B3F72] cursor-pointer">
          <div class="absolute left-0 top-0 bottom-0 w-[3px] bg-[#4B3F72]"></div>
          <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">settings</span>
          <span class="text-[10px] font-medium tracking-tight mt-1 text-[#4B3F72]">Ajustes</span>
        </div>

      </div>

      <!-- Pie de versión -->
      <div class="p-2 text-center text-[9px] font-mono text-[#8E8E88] border-t border-[#DCDCD7]">
        v2.4
      </div>
    </aside>

    <!-- ================= ÁREA DE CONTENIDO PRINCIPAL ================= -->
    <main class="flex-1 p-6 overflow-auto bg-[#E6E6E2]">
      
      <!-- Título de pantalla -->
      <div class="mb-5">
        <h1 class="text-[20px] font-semibold text-[#1A1A18] tracking-tight leading-none" style="font-family: 'Archivo', sans-serif;">
          Ajustes
        </h1>
      </div>

      <!-- Panel único central de Ajustes (Plano, borde 1px, fondo #FAFAF8) -->
      <div class="max-w-[760px] bg-[#FAFAF8] border border-[#C9C9C3] p-6 box-border">
        
        <!-- Bloque único: Carpeta de salida -->
        <div>
          <!-- Nombre de la sección -->
          <h2 class="text-[14px] font-semibold text-[#1A1A18] tracking-tight mb-1" style="font-family: 'Archivo', sans-serif;">
            Carpeta de salida
          </h2>
          
          <!-- Texto de ayuda literal -->
          <p class="text-[12px] text-[#555550] leading-relaxed mb-4">
            Aquí se guardan el Excel limpio, el Excel auditado y los PDF consolidados de cada lote.
          </p>

          <!-- Fila de control: Campo de solo lectura + Botón secundario -->
          <div class="flex items-center gap-3">
            <!-- Campo de texto de solo lectura en IBM Plex Mono -->
            <div class="flex-1 relative">
              <input 
                type="text" 
                readonly 
                value="D:\LuxMed\salidas" 
                class="w-full h-[36px] px-3 bg-[#F0EFEB] border border-[#C9C9C3] text-[13px] font-mono font-medium text-[#1A1A18] select-all cursor-default focus:outline-none"
                style="border-radius: 2px;"
              />
            </div>

            <!-- Botón secundario "Cambiar…" (36px, estilo QSS plano) -->
            <button 
              type="button"
              class="h-[36px] px-4 bg-[#EAEAE6] hover:bg-[#DCDCD7] active:bg-[#C9C9C3] border border-[#C9C9C3] text-[13px] font-medium text-[#1A1A18] flex items-center gap-1.5 cursor-pointer whitespace-nowrap select-none"
              style="border-radius: 2px; font-family: 'Archivo', sans-serif;"
            >
              <span class="material-symbols-outlined text-[16px] text-[#555550]">folder_open</span>
              <span>Cambiar…</span>
            </button>
          </div>
        </div>

      </div>

    </main>

  </div>

  <!-- SIN BARRA DE ESTADO INFERIOR SEGÚN REQUERIMIENTO -->

</body>
</html>
